name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Headless Render & Tests (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check environment with doctor
        run: python3 skills/oil-showcase/scripts/render_cards.py doctor

      - name: Run unit and integration tests
        run: python3 -W error -m unittest discover -s skills/oil-showcase/tests -v
