<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>oil-showcase Hero (EN)</title>
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 480px;
      overflow: hidden;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .canvas {
      position: relative;
      width: 1200px;
      height: 480px;
      border-radius: 24px;
      overflow: hidden;
      background: radial-gradient(ellipse 92% 96% at 24% 48%, #FAF8F2 0%, #F3EFE4 56%, #E8E2D4 100%);
      border: 1.5px solid #D7D4C8;
      display: flex;
      align-items: center;
    }

    .left {
      position: relative;
      z-index: 4;
      width: 472px;
      height: 100%;
      padding: 0 24px 0 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #55584F;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #991B1B;
      flex-shrink: 0;
    }
    h1 {
      margin-top: -2px;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      font-size: 64px;
      line-height: 1.03;
      letter-spacing: -0.028em;
      color: #1B1C19;
      white-space: nowrap;
    }
    .rule {
      width: 100%;
      height: 1px;
      background: rgba(27, 28, 25, 0.14);
    }
    .value {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 400;
      font-size: 19.5px;
      line-height: 1.44;
      color: #383B34;
    }
    .swatches {
      margin-top: -2px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11.5px;
      border-radius: 999px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 500;
      color: #262823;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(27, 28, 25, 0.14);
      white-space: nowrap;
    }
    .chip.warm {
      background: #FAF7F0;
      border-color: #C9C1B2;
    }
    .dot {
      width: 9.5px;
      height: 9.5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.warm { background: #EAE3D2; border: 1px solid #B8B09E; }
    .dot.dark { background: #14161B; border: 1px solid #0B0C0F; }
    .dot.cool { background: #DFE5EE; border: 1px solid #9FAAB9; }

    .spec-strip {
      margin-top: 2px;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #5A5E56;
      white-space: nowrap;
    }

    .stage {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 36px 0 8px;
    }
    .specimen {
      width: 684px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(28, 29, 26, 0.14);
      box-shadow:
        0 26px 56px -18px rgba(27, 25, 20, 0.24),
        0 6px 18px -6px rgba(27, 25, 20, 0.10);
      background: #F6F3EC;
    }
    .specimen img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="left">
      <div class="eyebrow">
        <span class="eyebrow-dot"></span>
        <span>OPEN-SOURCE AGENT SKILL · PRODUCT SHOWCASE</span>
      </div>
      <h1>oil-showcase</h1>
      <div class="rule"></div>
      <p class="value">Turn real product screenshots into<br>gallery-grade breakdown cards.</p>
      <div class="swatches">
        <span class="chip warm"><span class="dot warm"></span>warm-paper</span>
        <span class="chip"><span class="dot dark"></span>dark-studio</span>
        <span class="chip"><span class="dot cool"></span>cool-gallery</span>
      </div>
      <div class="spec-strip">8 LAYOUTS · 5 RATIOS · 2× PNG · ZERO IMAGE GEN</div>
    </div>

    <div class="stage">
      <div class="specimen">
        <img src="../04-warm-section-assembly.webp" alt="warm-paper section-assembly showcase card mapping four crimson Kova plates to one continuous landing page">
      </div>
    </div>
  </div>
</body>
</html>
