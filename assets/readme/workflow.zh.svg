<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="title desc">
  <title id="title">oil-showcase 本地离线渲染流程</title>
  <desc id="desc">四步确定性本地渲染管线：真实素材采集、编写规格 JSON、本地无头浏览器 2 倍缩放渲染与溢出检查、输出多比例高清 PNG 与离线总览页。</desc>

  <!-- 外层暖纸画板（兼容 GitHub 浅色与深色模式） -->
  <rect x="1" y="1" width="1198" height="278" rx="20" fill="#FAF8F1" stroke="#DCDED3" stroke-width="1.5"/>

  <!-- 顶部状态条 -->
  <g id="pipeline-header">
    <circle cx="42" cy="36" r="4.5" fill="#2563EB"/>
    <text x="58" y="42" fill="#5D6058"
          font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', sans-serif"
          font-size="16" font-weight="500" letter-spacing="1.0">确定性本地渲染管线</text>
    <text x="1164" y="42" text-anchor="end" fill="#5D6058"
          font-family="ui-monospace, SFMono-Regular, Menlo, 'PingFang SC', sans-serif"
          font-size="16" font-weight="500" letter-spacing="0.6">100% 本地离线 · 零生图依赖</text>
    <line x1="36" y1="58" x2="1164" y2="58" stroke="#E4E1D6" stroke-width="1"/>
  </g>

  <!-- 虚线箭头连接 -->
  <g id="connectors" fill="none" stroke="#8C8F84" stroke-width="1.8">
    <line x1="298" y1="163" x2="318" y2="163" stroke-dasharray="4 3"/>
    <polygon points="325,163 316,158 316,168" fill="#8C8F84" stroke="none"/>

    <line x1="587" y1="163" x2="607" y2="163" stroke-dasharray="4 3"/>
    <polygon points="614,163 605,158 605,168" fill="#8C8F84" stroke="none"/>

    <line x1="876" y1="163" x2="896" y2="163" stroke-dasharray="4 3"/>
    <polygon points="903,163 894,158 894,168" fill="#8C8F84" stroke="none"/>
  </g>

  <!-- 阶段 01 -->
  <g id="stage-01" transform="translate(36 78)">
    <rect width="260" height="170" rx="14" fill="#FFFFFF" stroke="#E2DFD5" stroke-width="1.2"/>
    <text x="20" y="36" fill="#2563EB"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="18" font-weight="600">01</text>
    <g transform="translate(216 18)" fill="none" stroke="#8C8F84" stroke-width="1.5">
      <rect x="0" y="4" width="18" height="14" rx="2.5"/>
      <rect x="6" y="0" width="18" height="14" rx="2.5" fill="#FFFFFF"/>
    </g>
    <text x="20" y="76" fill="#1B1C19"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="22" font-weight="600">真实素材</text>
    <text x="20" y="114" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">应用截图与分层素材</text>
    <text x="20" y="142" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">或本地 HTML 抓图</text>
  </g>

  <!-- 阶段 02 -->
  <g id="stage-02" transform="translate(325 78)">
    <rect width="260" height="170" rx="14" fill="#FFFFFF" stroke="#E2DFD5" stroke-width="1.2"/>
    <text x="20" y="36" fill="#2563EB"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="18" font-weight="600">02</text>
    <g transform="translate(216 18)" fill="none" stroke="#8C8F84" stroke-width="1.5">
      <rect x="0" y="0" width="22" height="18" rx="3"/>
      <line x1="9" y1="0" x2="9" y2="18"/>
      <line x1="9" y1="9" x2="22" y2="9"/>
    </g>
    <text x="20" y="76" fill="#1B1C19"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="22" font-weight="600">规格 JSON</text>
    <text x="20" y="114" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">选定主题、版式与画幅</text>
    <text x="20" y="142" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">克制标题，聚焦界面</text>
  </g>

  <!-- 阶段 03 -->
  <g id="stage-03" transform="translate(614 78)">
    <rect width="260" height="170" rx="14" fill="#FFFFFF" stroke="#E2DFD5" stroke-width="1.2"/>
    <text x="20" y="36" fill="#15803D"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="18" font-weight="600">03</text>
    <g transform="translate(218 18)" fill="none" stroke="#8C8F84" stroke-width="1.5">
      <circle cx="10" cy="9" r="9"/>
      <path d="M6.5 9.2 L9 11.7 L14 6.7" stroke="#15803D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="20" y="76" fill="#1B1C19"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="22" font-weight="600">本地无头渲染</text>
    <text x="20" y="114" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">内置字体 2× 离线排版</text>
    <text x="20" y="142" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">自动检查解码与溢出</text>
  </g>

  <!-- 阶段 04 -->
  <g id="stage-04" transform="translate(903 78)">
    <rect width="260" height="170" rx="14" fill="#FFFFFF" stroke="#BFC2B6" stroke-width="1.5"/>
    <text x="20" y="36" fill="#1B1C19"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="18" font-weight="600">04</text>
    <g transform="translate(216 18)" fill="none" stroke="#1B1C19" stroke-width="1.5">
      <rect x="0" y="0" width="9" height="8" rx="1.5"/>
      <rect x="13" y="0" width="9" height="8" rx="1.5"/>
      <rect x="0" y="11" width="9" height="8" rx="1.5"/>
      <rect x="13" y="11" width="9" height="8" rx="1.5"/>
    </g>
    <text x="20" y="76" fill="#1B1C19"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="22" font-weight="600">高清成图交付</text>
    <text x="20" y="114" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">16:9·4:3·3:4·9:16·1:1</text>
    <text x="20" y="142" fill="#5D6058"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="18" font-weight="400">2× PNG 与离线总览页</text>
  </g>
</svg>
